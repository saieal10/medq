name: MedQ Process Single Book - Turbo Direct

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: 'Supabase book ID'
        required: true
        type: string
      file_key:
        description: 'R2 file key'
        required: true
        type: string
      subject:
        description: 'Book subject'
        required: true
        type: string
      exam_track:
        description: 'Exam track'
        required: true
        type: choice
        options:
          - AMC
          - FMGE_NEET_PG
          - BOTH

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 botocore supabase requests pymupdf
      - name: Direct MCQ extraction
        env:
          BOOK_ID: ${{ inputs.book_id }}
          FILE_KEY: ${{ inputs.file_key }}
          BOOK_SUBJECT: ${{ inputs.subject }}
          BOOK_EXAM_TRACK: ${{ inputs.exam_track }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          MAX_MCQS_PER_RUN: '2000'
          SAVE_BATCH: '250'
          MAX_PAGES: '0'
        run: python worker/process_book.py
