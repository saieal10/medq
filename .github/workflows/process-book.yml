name: MedQ Process Book

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Supabase Book ID"
        required: true
        type: string

      file_key:
        description: "Cloudflare R2 file key"
        required: true
        type: string

      subject:
        description: "Book subject"
        required: true
        type: string

      exam_track:
        description: "Exam track"
        required: true
        type: choice
        options:
          - fmge_neetpg
          - amc

jobs:
  process-book:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      BOOK_ID: ${{ inputs.book_id }}
      FILE_KEY: ${{ inputs.file_key }}
      BOOK_SUBJECT: ${{ inputs.subject }}
      BOOK_EXAM_TRACK: ${{ inputs.exam_track }}

      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip

          pip install \
            requests \
            python-dotenv \
            pypdf \
            pdfplumber \
            pymupdf \
            pytesseract \
            google-generativeai \
            boto3

      - name: Show processing configuration
        run: |
          echo "======================================"
          echo "MedQ Book Processing"
          echo "======================================"
          echo "Book ID: ${BOOK_ID}"
          echo "Subject: ${BOOK_SUBJECT}"
          echo "Exam Track: ${BOOK_EXAM_TRACK}"
          echo "File Key: ${FILE_KEY}"
          echo "======================================"

      - name: Process book
        run: |
          python worker/process_book.py

      - name: Processing completed
        if: success()
        run: |
          echo "======================================"
          echo "MedQ book processing completed."
          echo "======================================"

      - name: Processing failed
        if: failure()
        run: |
          echo "======================================"
          echo "MedQ book processing FAILED."
          echo "Check the logs above."
          echo "======================================"
