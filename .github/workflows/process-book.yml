# =========================================================

def main():

    print(
        "=========================================="
    )

    print(
        "MEDQ FULL TEXTBOOK PROCESSOR"
    )

    print(
        f"Book ID: {BOOK_ID}"
    )

    print(
        f"Subject: {BOOK_SUBJECT}"
    )

    print(
        "=========================================="
    )

    set_stage(
        "downloading",
        processing_started_at=
            "now()",
        error_message=None
    )

    try:

        with tempfile.TemporaryDirectory() as temp_dir:

            pdf_path = os.path.join(
                temp_dir,
                "book.pdf"
            )

            download_pdf(
                pdf_path
            )

            set_stage(
                "extracting"
            )

            pages = extract_pages(
                pdf_path
            )

            if not pages:
                raise RuntimeError(
                    "No usable textbook text "
                    "could be extracted."
                )

            set_stage(
                "chunking",
                extraction_progress=100
            )

            chunks = make_chunks(
                pages
            )

            if not chunks:
                raise RuntimeError(
                    "No textbook chunks created."
                )

            saved_chunks = save_book_chunks(
                chunks
            )

            if not saved_chunks:
                raise RuntimeError(
                    "Textbook chunks could not "
                    "be saved."
                )

            # At this point the textbook itself
            # is already available as a reusable
            # knowledge base for MedBot/search.

            set_stage(
                "generating_questions",
                extraction_progress=100
            )

            total_questions = (
                generate_questions_for_chunks(
                    saved_chunks
                )
            )

            if total_questions == 0:

                raise RuntimeError(
                    "Textbook extraction succeeded "
                    "but no questions were generated."
                )

            update_book({
                "status": "ready",

                "processing_stage":
                    "ready",

                "extraction_progress":
                    100,

                "question_progress":
                    100,

                "questions_generated":
                    total_questions,

                "processed_pages":
                    len(pages),

                "processing_completed_at":
                    "now()",

                "error_message":
                    None
            })

            print(
                "=========================================="
            )

            print(
                "TEXTBOOK PROCESSING COMPLETE"
            )

            print(
                f"Questions available: "
                f"{total_questions}"
            )

            print(
                "=========================================="
            )

    except Exception as exc:

        print(
            "=========================================="
        )

        print(
            "PROCESSING FAILED"
        )

        print(
            str(exc)
        )

        print(
            "=========================================="
        )

        try:

            update_book({
                "status":
                    "failed",

                "processing_stage":
                    "failed",

                "error_message":
                    str(exc)[:1000]
            })

        except Exception as status_exc:

            print(
                "Could not save failure status:"
            )

            print(
                status_exc
            )

        raise


if __name__ == "__main__":
    main()
