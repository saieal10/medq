# =========================================================
# TEXT CLEANING
# =========================================================

def clean_text(text: str) -> str:

    if not text:
        return ""

    text = text.replace(
        "\x00",
        " "
    )

    text = re.sub(
        r"[ \t]+",
        " ",
        text
    )

    text = re.sub(
        r"\n[ \t]+\n",
        "\n\n",
        text
    )

    text = re.sub(
        r"\n{3,}",
        "\n\n",
        text
    )

    return text.strip()


# =========================================================
# OCR
# =========================================================

def ocr_page(page) -> str:

    zoom = OCR_DPI / 72

    matrix = fitz.Matrix(
        zoom,
        zoom
    )

    pix = page.get_pixmap(
        matrix=matrix,
        alpha=False
    )

    image = Image.open(
        io.BytesIO(
            pix.tobytes("png")
        )
    )

    text = pytesseract.image_to_string(
        image,
        lang="eng",
        config="--psm 6"
    )

    return clean_text(text)


# =========================================================
# PDF EXTRACTION
# =========================================================

def extract_pages(
    pdf_path: str
) -> List[Dict[str, Any]]:

    document = fitz.open(pdf_path)

    total_pages = len(document)

    print(
        f"[PDF] Total pages: {total_pages}"
    )

    update_book({
        "page_count": total_pages,
        "total_pages": total_pages,
        "processed_pages": 0,
        "extraction_progress": 0
    })

    extracted = []

    last_progress = -1

    for index in range(total_pages):

        page = document[index]

        page_number = index + 1

        native_text = clean_text(
            page.get_text("text")
        )

        extraction_method = "text"

        text = native_text

        # OCR only pages where useful embedded text
        # does not already exist.
        if len(native_text) < NATIVE_TEXT_MIN_CHARS:

            extraction_method = "ocr"

            try:
                text = ocr_page(page)

            except Exception as exc:

                print(
                    f"[OCR] Page {page_number} failed: "
                    f"{exc}"
                )

                text = native_text

                extraction_method = "text-fallback"

        if len(text) >= MIN_USABLE_PAGE_CHARS:

            extracted.append({
                "page": page_number,
                "text": text,
                "method": extraction_method
            })

        progress = int(
            (page_number / total_pages) * 100
        )

        if (
            progress >= last_progress + 2
            or page_number == total_pages
        ):

            update_book({
                "processed_pages": page_number,
                "extraction_progress": progress
            })

            last_progress = progress

            print(
                f"[PDF] Extraction {progress}% "
                f"({page_number}/{total_pages})"
            )

    document.close()

    print(
        f"[PDF] Usable pages extracted: "
        f"{len(extracted)}/{total_pages}"
    )

    return extracted


# =========================================================
# CHAPTER / HEADING HEURISTIC
# =========================================================

def possible_heading(
    text: str
) -> Optional[str]:

    lines = [
        line.strip()
        for line in text.splitlines()
        if line.strip()
    ]

    for line in lines[:15]:

        candidate = re.sub(
            r"\s+",
            " ",
            line
        ).strip()

        if len(candidate) < 4:
            continue

        if len(candidate) > 120:
            continue

        words = candidate.split()

        if len(words) > 14:
            continue

        upper_ratio = (
            sum(
                1
                for char in candidate
                if char.isupper()
            )
            /
            max(
                sum(
                    1
                    for char in candidate
                    if char.isalpha()
                ),
                1
            )
        )

        looks_numbered = bool(
            re.match(
                r"^(chapter\s+)?\d+[\s:.\-]",
                candidate,
                flags=re.IGNORECASE
            )
        )

        looks_heading = (
            upper_ratio > 0.65
            or looks_numbered
        )

        if looks_heading:
            return candidate[:120]

    return None


# =========================================================
# CHUNKING
# =========================================================

def make_chunks(
    pages: List[Dict[str, Any]]
) -> List[Dict[str, Any]]:

    chunks = []

    current_text = ""
    current_pages = []
    current_methods = []
    current_heading = None

    for page in pages:

        heading = possible_heading(
            page["text"]
        )

        if heading:
            current_heading = heading

        page_marker = (
            f"\n\n"
            f"--- PAGE {page['page']} ---\n"
        )

        addition = (
            page_marker
            + page["text"]
        )

        if (
            current_text
            and
            len(current_text)
            + len(addition)
            > CHUNK_SIZE
        ):

            chunks.append({
                "text": current_text.strip(),
                "pages": current_pages.copy(),
                "methods": current_methods.copy(),
                "chapter": current_heading
            })

            current_text = ""
            current_pages = []
            current_methods = []

        current_text += addition

        current_pages.append(
            page["page"]
        )

        current_methods.append(
            page["method"]
        )

    if current_text:

        chunks.append({
            "text": current_text.strip(),
            "pages": current_pages,
            "methods": current_methods,
            "chapter": current_heading
        })

    print(
        f"[CHUNK] Created "
        f"{len(chunks)} textbook chunks"
    )

    return chunks


# =========================================================
# SAVE TEXTBOOK CHUNKS
# =========================================================

def chunk_extraction_method(
    methods: List[str]
) -> str:

    methods_set = set(methods)

    if methods_set == {"text"}:
        return "text"

    if "ocr" in methods_set:
        return "mixed"

    return "mixed"


def save_book_chunks(
    chunks: List[Dict[str, Any]]
) -> List[Dict[str, Any]]:

    print("[DB] Saving textbook knowledge chunks...")

    rows = []

    for index, chunk in enumerate(chunks):

        pages = chunk["pages"]

        rows.append({
            "book_id": BOOK_ID,
            "chunk_index": index,
            "chapter": (
                chunk.get("chapter")
                or f"Pages {min(pages)}-{max(pages)}"
            ),
            "section": None,
            "topic": None,
            "page_start": min(pages),
            "page_end": max(pages),
            "content": chunk["text"],
            "word_count": len(
                chunk["text"].split()
            ),
            "extraction_method":
                chunk_extraction_method(
                    chunk["methods"]
                ),
            "processing_status": "ready"
        })

    # Insert/upsert in moderate batches.
    batch_size = 25

    for start in range(
        0,
        len(rows),
        batch_size
    ):

        batch = rows[
            start:start + batch_size
        ]

        (
            supabase
            .table("book_chunks")
            .upsert(
                batch,
                on_conflict="book_id,chunk_index"
            )
            .execute()
        )

        print(
            f"[DB] Stored chunks "
            f"{start + 1}-"
            f"{min(start + batch_size, len(rows))}"
        )

    result = (
        supabase
        .table("book_chunks")
        .select(
            "id,chunk_index,chapter,"
            "page_start,page_end,content"
        )
        .eq(
            "book_id",
            BOOK_ID
        )
        .order(
            "chunk_index"
        )
        .execute()
    )

    saved_chunks = result.data or []

    print(
        f"[DB] Knowledge base contains "
        f"{len(saved_chunks)} chunks"
    )

    return saved_chunks


# =========================================================
# AI JSON PARSER
# =========================================================

def parse_ai_json(
    content: str
) -> List[Dict[str, Any]]:

    if not content:
        raise RuntimeError(
            "AI returned empty response."
        )

    content = content.strip()

    content = re.sub(
        r"^```(?:json)?",
        "",
        content,
        flags=re.IGNORECASE
    )

    content = re.sub(
        r"```$",
        "",
        content
    )

    content = content.strip()

    start = content.find("[")
    end = content.rfind("]")

    if start == -1 or end == -1:
        raise RuntimeError(
            "AI response did not contain JSON array."
        )

    content = content[
        start:end + 1
    ]

    try:
        result = json.loads(
            content
        )

    except Exception as exc:

        print(
            "[AI] Invalid JSON preview:"
        )

        print(
            content[:3000]
        )

        raise RuntimeError(
            f"Unable to parse AI JSON: {exc}"
        )

    if not isinstance(
        result,
        list
    ):
        raise RuntimeError(
            "AI JSON was not a list."
        )

    return result


# =========================================================
# OPENROUTER
# =========================================================

def call_openrouter(
    chunk: Dict[str, Any]
) -> List[Dict[str, Any]]:

    page_start = chunk["page_start"]
    page_end = chunk["page_end"]

    chapter = (
        chunk.get("chapter")
        or "Unknown"
    )

    source_text = chunk["content"]

    system_prompt = """
You are the senior medical assessment writer for MedQ.

MedQ prepares medical students specifically for:

1. Australian Medical Council (AMC) CAT MCQ style
2. Foreign Medical Graduate Examination (FMGE) style

You are converting medical textbook content into original,
high-quality single-best-answer questions.

IMPORTANT SOURCE RULES

Use the supplied textbook passage as the medical knowledge source.

Do not introduce unsupported facts.

Do not copy sentences from the textbook unnecessarily.

Questions must be educational transformations of the source,
not reproductions of the textbook.

AMC QUESTION STYLE

AMC questions should prioritise:
- realistic clinical vignettes
- clinical reasoning
- diagnosis
- differential diagnosis
- next best investigation
- interpretation of findings
- immediate management
- definitive management
- complications
- pharmacological decisions
- patient safety
- prioritisation and next-best-step reasoning

Avoid making AMC questions simple fact-recall questions
when the material supports clinical reasoning.

FMGE QUESTION STYLE

FMGE questions should represent a balanced MBBS examination style:
- high-yield concepts
- clinical application
- diagnosis
- pathology
- microbiology
- pharmacology
- investigations
- treatment
- complications
- mechanisms
- characteristic findings
- important associations

QUALITY RULES

Every question must:
- contain exactly five options A-E
- have exactly one best answer
- have plausible distractors
- avoid ambiguous wording
- avoid giving away the answer in the stem
- test an important concept
- include a useful explanation
- explain why the correct answer is correct
- identify a specific topic
- include a sensible difficulty
- remain answerable from the supplied textbook material

Before returning a question, internally check that
the keyed answer is actually supported by the passage.

Create a mixture of AMC and FMGE questions.

Approximately half should be AMC and half FMGE.

Return ONLY a valid JSON array.

Never use Markdown fences.

Required structure:

[
  {
    "exam_type": "AMC",
    "question_type": "clinical_reasoning",
    "stem": "...",
    "option_a": "...",
    "option_b": "...",
    "option_c": "...",
    "option_d": "...",
    "option_e": "...",
    "correct_option": "A",
    "explanation": "...",
    "chapter": "...",
    "topic": "...",
    "difficulty": "medium",
    "source_page": 123,
    "source_page_end": 124
  }
]
""".strip()

    user_prompt = f"""
TEXTBOOK SUBJECT:
{BOOK_SUBJECT}

DETECTED CHAPTER/SECTION:
{chapter}

SOURCE PAGE RANGE:
{page_start}-{page_end}

Generate exactly {QUESTIONS_PER_CHUNK} strong questions.

Use both AMC and FMGE patterns.

Do not create several questions testing the same fact.

Choose the most educational and exam-relevant concepts
present in this passage.

SOURCE TEXT:

{source_text}
""".strip()

    headers = {
        "Authorization":
            f"Bearer {OPENROUTER_API_KEY}",

        "Content-Type":
            "application/json",

        "HTTP-Referer":
            "https://medq-practice.netlify.app",

        "X-Title":
            "MedQ"
    }

    payload = {
        "model": OPENROUTER_MODEL,

        "messages": [
            {
                "role": "system",
                "content": system_prompt
            },
            {
                "role": "user",
                "content": user_prompt
            }
        ],

        "temperature": 0.2,

        "max_tokens": 7000
    }

    response = requests.post(
        OPENROUTER_URL,
        headers=headers,
        json=payload,
        timeout=240
    )

    if not response.ok:

        print(
            "[AI] OpenRouter error:"
        )

        print(
            response.text[:3000]
        )

        raise RuntimeError(
            "OpenRouter request failed: "
            f"{response.status_code}"
        )

    data = response.json()

    content = (
        data
        .get(
            "choices",
            [{}]
        )[0]
        .get(
            "message",
            {}
        )
        .get(
            "content",
            ""
        )
    )

    return parse_ai_json(content)


# =========================================================
# QUESTION VALIDATION
# =========================================================

def prepare_question(
    question: Dict[str, Any],
    chunk: Dict[str, Any]
) -> Optional[Dict[str, Any]]:

    required_fields = [
        "stem",
        "option_a",
        "option_b",
        "option_c",
        "option_d",
        "option_e",
        "correct_option",
        "explanation"
    ]

    for field in required_fields:

        value = question.get(field)

        if not value:
            print(
                f"[VALIDATION] Missing {field}"
            )

            return None

    correct_option = str(
        question.get(
            "correct_option",
            ""
        )
    ).strip().upper()

    if correct_option not in [
        "A",
        "B",
        "C",
        "D",
        "E"
    ]:
        return None

    exam_type = str(
        question.get(
            "exam_type",
            "FMGE"
        )
    ).strip().upper()

    if exam_type not in [
        "AMC",
        "FMGE"
    ]:
        exam_type = "FMGE"

    difficulty = str(
        question.get(
            "difficulty",
            "medium"
        )
    ).strip().lower()

    if difficulty not in [
        "easy",
        "medium",
        "hard"
    ]:
        difficulty = "medium"

    source_page = question.get(
        "source_page"
    )

    source_page_end = question.get(
        "source_page_end"
    )

    try:
        source_page = int(
            source_page
        )
    except Exception:
        source_page = chunk[
            "page_start"
        ]

    try:
        source_page_end = int(
            source_page_end
        )
    except Exception:
        source_page_end = source_page

    # Prevent AI from citing pages
    # outside the source chunk.
    if (
        source_page
        < chunk["page_start"]
        or source_page
        > chunk["page_end"]
    ):
        source_page = chunk[
            "page_start"
        ]

    if (
        source_page_end
        < source_page
        or source_page_end
        > chunk["page_end"]
    ):
        source_page_end = source_page

    stem = str(
        question["stem"]
    ).strip()

    options = [
        str(question["option_a"]).strip(),
        str(question["option_b"]).strip(),
        str(question["option_c"]).strip(),
        str(question["option_d"]).strip(),
        str(question["option_e"]).strip(),
    ]

    # Reject duplicate answer options.
    if len(
        set(
            option.lower()
            for option in options
        )
    ) != 5:
        return None

    if len(stem) < 25:
        return None

    explanation = str(
        question["explanation"]
    ).strip()

    if len(explanation) < 30:
        return None

    return {
        "book_id": BOOK_ID,

        "source_chunk_id":
            chunk["id"],

        "subject":
            BOOK_SUBJECT,

        "chapter":
            str(
                question.get(
                    "chapter",
                    chunk.get(
                        "chapter",
                        ""
                    )
                )
            )[:250],

        "topic":
            str(
                question.get(
                    "topic",
                    ""
                )
            )[:250],

        "exam_type":
            exam_type,

        "question_type":
            str(
                question.get(
                    "question_type",
                    "concept"
                )
            )[:100],

        "difficulty":
            difficulty,

        "stem":
            stem,

        "option_a":
            options[0],

        "option_b":
            options[1],

        "option_c":
            options[2],

        "option_d":
            options[3],

        "option_e":
            options[4],

        "correct_option":
            correct_option,

        "explanation":
            explanation,

        "source_page":
            source_page,

        "source_page_end":
            source_page_end,

        "review_status":
            "generated",

        "quality_score":
            None,

        "reviewer_notes":
            None
    }


# =========================================================
# QUESTION STORAGE
# =========================================================

def questions_exist_for_chunk(
    chunk_id: str
) -> bool:

    result = (
        supabase
        .table("questions")
        .select(
            "id",
            count="exact"
        )
        .eq(
            "book_id",
            BOOK_ID
        )
        .eq(
            "source_chunk_id",
            chunk_id
        )
        .limit(1)
        .execute()
    )

    return bool(
        result.data
    )


def save_questions(
    generated: List[Dict[str, Any]],
    chunk: Dict[str, Any]
) -> int:

    valid_questions = []

    seen_stems = set()

    for question in generated:

        cleaned = prepare_question(
            question,
            chunk
        )

        if not cleaned:
            continue

        normalized_stem = re.sub(
            r"\W+",
            "",
            cleaned["stem"].lower()
        )

        if normalized_stem in seen_stems:
            continue

        seen_stems.add(
            normalized_stem
        )

        valid_questions.append(
            cleaned
        )

    if not valid_questions:
        return 0

    result = (
        supabase
        .table("questions")
        .insert(
            valid_questions
        )
        .execute()
    )

    count = len(
        result.data or []
    )

    return count


# =========================================================
# QUESTION GENERATION
# =========================================================

def generate_questions_for_chunks(
    chunks: List[Dict[str, Any]]
) -> int:

    total_chunks = len(chunks)

    total_created = 0

    existing_result = (
        supabase
        .table("questions")
        .select(
            "id",
            count="exact"
        )
        .eq(
            "book_id",
            BOOK_ID
        )
        .execute()
    )

    total_created = (
        existing_result.count
        if existing_result.count is not None
        else len(
            existing_result.data or []
        )
    )

    for index, chunk in enumerate(
        chunks,
        start=1
    ):

        progress = int(
            ((index - 1) / total_chunks)
            * 100
        )

        update_book({
            "question_progress":
                progress,

            "questions_generated":
                total_created
        })

        if questions_exist_for_chunk(
            chunk["id"]
        ):

            print(
                f"[AI] Chunk {index}/{total_chunks} "
                f"already has questions — skipping"
            )

            continue

        print(
            f"[AI] Generating questions "
            f"for chunk {index}/{total_chunks} "
            f"(pages "
            f"{chunk['page_start']}-"
            f"{chunk['page_end']})"
        )

        try:

            generated = call_openrouter(
                chunk
            )

            saved = save_questions(
                generated,
                chunk
            )

            total_created += saved

            print(
                f"[AI] Saved {saved} questions"
            )

        except Exception as exc:

            print(
                f"[AI] Chunk {index} failed: "
                f"{exc}"
            )

        update_book({
            "question_progress":
                int(
                    (index / total_chunks)
                    * 100
                ),

            "questions_generated":
                total_created
        })

        time.sleep(
            AI_DELAY_SECONDS
        )

    return total_created


