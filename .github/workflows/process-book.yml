name: MedQ Process Single Book - Turbo

on:
  workflow_dispatch:
    inputs:
      book_id:
        required: true
        type: string
      file_key:
        required: true
        type: string
      subject:
        required: true
        type: string
      exam_track:
        required: true
        type: choice
        options: [AMC, FMGE_NEET_PG, BOTH]

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 botocore supabase requests pymupdf
      - name: Turbo MCQ extraction
        env:
          BOOK_ID: ${{ inputs.book_id }}
          FILE_KEY: ${{ inputs.file_key }}
          BOOK_SUBJECT: ${{ inputs.subject }}
          BOOK_EXAM_TRACK: ${{ inputs.exam_track }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          MAX_MCQS_PER_RUN: "800"
          AI_BATCH_SIZE: "50"
          MAX_AI_PARALLEL: "5"
        run: python worker/process_book.py
