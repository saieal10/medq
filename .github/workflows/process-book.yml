name: MedQ Process Book

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Supabase book ID"
        required: true
        type: string

      exam_mode:
        description: "Exam mode"
        required: true
        type: choice
        options:
          - AMC
          - FMGE
          - BOTH
        default: FMGE

      target_subject:
        description: "Optional target subject"
        required: false
        type: string

      target_topic:
        description: "Optional target topic"
        required: false
        type: string

      target_subtopic:
        description: "Optional target subtopic"
        required: false
        type: string

      difficulty:
        description: "Question difficulty"
        required: true
        type: choice
        options:
          - Easy
          - Medium
          - Hard
          - Mixed
        default: Mixed

jobs:
  process-book:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            requests \
            supabase \
            boto3 \
            pypdf \
            pdfplumber \
            pymupdf \
            pytesseract \
            pillow

      - name: Run full book processor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash

          BOOK_ID: ${{ inputs.book_id }}
          EXAM_MODE: ${{ inputs.exam_mode }}
          TARGET_SUBJECT: ${{ inputs.target_subject }}
          TARGET_TOPIC: ${{ inputs.target_topic }}
          TARGET_SUBTOPIC: ${{ inputs.target_subtopic }}
          DIFFICULTY: ${{ inputs.difficulty }}

        run: |
          python worker/process_book.py
