
name: MedQ Process Book

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Supabase book ID"
        required: true
        type: string
      file_key:
        description: "R2 object key"
        required: true
        type: string
      subject:
        description: "Main subject"
        required: true
        type: string
      exam_track:
        description: "AMC or FMGE_NEET_PG"
        required: false
        default: "FMGE_NEET_PG"
        type: string

jobs:
  process-book:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pymupdf pytesseract pillow requests supabase

      - name: Install OCR engine
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr

      - name: Run full-book question engine
        env:
          BOOK_ID: ${{ inputs.book_id }}
          FILE_KEY: ${{ inputs.file_key }}
          BOOK_SUBJECT: ${{ inputs.subject }}
          BOOK_EXAM_TRACK: ${{ inputs.exam_track }}

          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}

          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}

          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}

          # Speed/quality controls.
          CHUNK_SIZE: "18000"
          QUESTIONS_PER_CHUNK: "8"
          MAX_PARALLEL_AI: "3"
          AI_RETRIES: "4"
          AI_TIMEOUT: "150"
          MCQ_MIN_DETECTED: "8"
          MCQ_AI_BATCH: "20"
          OCR_DPI: "150"

        run: python worker/process_book.py
