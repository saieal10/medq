name: MedQ Process Single Book
on:
  workflow_dispatch:
    inputs:
      book_id:
        required: true
        type: string
      file_key:
        required: true
        type: string
      subject:
        required: true
        type: string
      exam_track:
        required: false
        default: fmge_neetpg
        type: string
jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install boto3 pymupdf supabase==2.18.1 botocore
      - name: Process book
        env:
          BOOK_ID: ${{ inputs.book_id }}
          FILE_KEY: ${{ inputs.file_key }}
          BOOK_SUBJECT: ${{ inputs.subject }}
          BOOK_EXAM_TRACK: ${{ inputs.exam_track }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: medq-books
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAX_MCQS_PER_RUN: '5000'
          MAX_PAGES: '0'
        run: python worker/process_book.py
