name: MedQ AMC 1000 Daily Generator
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
concurrency:
  group: medq-amc-1000-daily
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Install
        run: pip install supabase==2.18.1 httpx==0.28.1
      - name: Generate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash
          AMC_DAILY_TARGET: "1000"
          AMC_REQUESTS_PER_RUN: "20"
          AMC_QUESTIONS_PER_REQUEST: "50"
          AMC_CONCURRENCY: "2"
        run: python worker/generate_amc.py
