name: MedQ MCQ Bank - FINAL Direct Extraction

on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'

concurrency:
  group: medq-final-direct-mcq-bank
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build real parallel book matrix
        id: matrix
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python - <<'PY'
          import json, os, requests
          u=os.environ['SUPABASE_URL'].rstrip('/')
          k=os.environ['SUPABASE_SECRET_KEY']
          h={'apikey':k,'Authorization':'Bearer '+k}
          r=requests.get(u+'/rest/v1/books?select=id,file_key,subject,exam_track&order=created_at.asc',headers=h,timeout=60)
          r.raise_for_status()
          books=[b for b in r.json() if b.get('id') and b.get('file_key')]
          matrix={'include':[{
            'book_id':str(b['id']),
            'file_key':b['file_key'],
            'subject':b.get('subject') or 'General',
            'exam_track':b.get('exam_track') or 'FMGE_NEET_PG'
          } for b in books]}
          print('BOOKS FOUND:',len(books))
          print(json.dumps(matrix))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
            f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
          PY

  process:
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '' && needs.discover.outputs.matrix != '{"include":[]}' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 botocore supabase requests pymupdf
      - name: FINAL direct MCQ extraction
        env:
          BOOK_ID: ${{ matrix.book_id }}
          FILE_KEY: ${{ matrix.file_key }}
          BOOK_SUBJECT: ${{ matrix.subject }}
          BOOK_EXAM_TRACK: ${{ matrix.exam_track }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          MAX_MCQS_PER_RUN: '5000'
          SAVE_BATCH: '250'
          MAX_PAGES: '0'
        run: python worker/process_book.py
