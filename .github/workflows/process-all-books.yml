name: MedQ Background Question Bank - All Books

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: medq-background-question-bank
  cancel-in-progress: false

jobs:
  find-books:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.books.outputs.matrix }}
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - id: books
        shell: bash
        run: |
          python - <<'PY'
          import os, json, urllib.request
          url = os.environ["SUPABASE_URL"].rstrip("/") + "/rest/v1/books?select=id,file_key,subject,exam_track,status&file_key=not.is.null"
          req = urllib.request.Request(url, headers={
              "apikey": os.environ["SUPABASE_SECRET_KEY"],
              "Authorization": "Bearer " + os.environ["SUPABASE_SECRET_KEY"]
          })
          data = json.load(urllib.request.urlopen(req, timeout=30))
          books = []
          for b in data:
              if b.get("id") and b.get("file_key"):
                  books.append({
                      "book_id": b["id"],
                      "file_key": b["file_key"],
                      "subject": b.get("subject") or "General",
                      "exam_track": b.get("exam_track") or "fmge_neetpg"
                  })
          print("Found", len(books), "books")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("matrix=" + json.dumps({"include": books}) + "\n")
          PY

  process-books:
    needs: find-books
    if: ${{ needs.find-books.outputs.matrix != '' && needs.find-books.outputs.matrix != '{"include":[]}' }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix: ${{ fromJson(needs.find-books.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      BOOK_ID: ${{ matrix.book_id }}
      FILE_KEY: ${{ matrix.file_key }}
      BOOK_SUBJECT: ${{ matrix.subject }}
      BOOK_EXAM_TRACK: ${{ matrix.exam_track }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.5-flash
      QUESTIONS_PER_CHUNK: 8
      AI_PASSES_PER_CHUNK: 2
      CHUNKS_PER_RUN: 20
      AI_RETRIES: 4
      AI_TIMEOUT: 150

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r worker/requirements.txt

      - name: Process and expand permanent question bank
        run: python worker/process_book.py
