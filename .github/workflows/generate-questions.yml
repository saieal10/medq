name: Generate MedQ Questions

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Supabase grounding book ID"
        required: true
        type: string
      chapter:
        description: "Exact chapter or __AUTO__"
        required: true
        default: "__AUTO__"
        type: string
      subject:
        description: "Target subject/domain or __ALL__"
        required: true
        default: "__ALL__"
        type: string
      difficulty:
        description: "all, easy, medium, or hard"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - easy
          - medium
          - hard
      exam_mode:
        description: "amc, fmge, or mixed"
        required: true
        default: "mixed"
        type: choice
        options:
          - amc
          - fmge
          - mixed
      count:
        description: "Number of questions"
        required: true
        default: "20"
        type: choice
        options:
          - "10"
          - "20"
          - "50"
          - "100"

jobs:
  generate-questions:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Generate MedQ exam questions
        env:
          BOOK_ID: ${{ inputs.book_id }}
          CHAPTER: ${{ inputs.chapter }}
          TARGET_SUBJECT: ${{ inputs.subject }}
          TARGET_DIFFICULTY: ${{ inputs.difficulty }}
          EXAM_MODE: ${{ inputs.exam_mode }}
          QUESTION_COUNT: ${{ inputs.count }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: python worker/generate_questions.py
